name: CI/CD StoreZoneV2

on:
  push:
    branches:
      - master # سيعمل الأكشن عند كل Push لفرع main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. سحب الكود من GitHub
    - uses: actions/checkout@v4

    # 2. إعداد بيئة .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10' # تأكد من إصدارك

    # 3. بناء المشروع (CI)
    - name: Build and Publish
      run: | 
        dotnet restore StoreZoneV2API.Web/StoreZoneV2API.Web.csproj
        dotnet build StoreZoneV2API.Web/StoreZoneV2API.Web.csproj --configuration Release
        dotnet publish StoreZoneV2API.Web/StoreZoneV2API.Web.csproj -c Release -o ./publish

    # 4. تسجيل الدخول إلى Azure
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 5. الرفع إلى Azure App Service (CD)
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_APP_NAME }}
        package: ./publish
